name: Quality and ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer validate --no-check-publish
      - run: composer install --no-dev --optimize-autoloader --no-interaction
      - run: find includes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l codeon-shipping-rules.php && php -l uninstall.php
      - run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: php -d error_reporting=E_ALL tests/Unit/run.php
      - name: Build plugin ZIPs
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 tools/package.py dist "$GITHUB_REF_NAME"
          else
            python3 tools/package.py dist
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: codeon-shipping-rules
          path: dist/*.zip
